  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8">

    <!-- ESSENCIAL PARA MOBILE / COLETOR -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galpão Cimed</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- CABEÇALHO -->
    <header class="header">
      <h2>Galpão Cimed</h2>

      <!-- CONTADORES À DIREITA -->
      <div class="contadores">
        <div>
          Cimed<br>
          <strong id="countCimed">0</strong>
        </div>
        <div>
          Entrada<br>
          <strong id="countEntrada">0</strong>
        </div>
        <div>
          Saída<br>
          <strong id="countSaida">0</strong>
        </div>
      </div>

      <img src="logo.png" alt="Logo da Empresa" class="logo">
    </header>

    <!-- BIPAGEM -->
    <section class="bipagem">
      <input
        id="input"
        type="text"
        placeholder="Bipe o código aqui"
        autocomplete="off"
        autofocus
      >
    </section>



    <!-- FILTROS -->
    <section class="filtros">
      <label>
        <strong>Status:</strong>
        <select id="filtroStatus">
          <option value="todos">Todos</option>
          <option value="Pendente Cimed">Pendente Cimed</option>
          <option value="Falta Entrada">Falta Entrada</option>
          <option value="Falta Saída">Falta Saída</option>
          <option value="OK">OK</option>
        </select>
      </label>

      <label>
        <strong>Data:</strong>
        <input type="date" id="filtroData">
      </label>
    </section>

    <!-- CABEÇALHO DO ACOMPANHAMENTO -->
    <div class="acomp-header">
      <h3>Acompanhamento por Código</h3>
      <button id="btnDownload" type="button">📥 Baixar Dados</button>
    </div>

    <!-- TABELA -->
    <div id="acompanhamento"></div>

    <!-- DEFINIÇÃO DA ETAPA -->
    <script>
      const ETAPA = "cimed";
    </script>

    <!-- SCRIPT PRINCIPAL -->
    <script src="script.js" defer></script>

  </body>
  </html>
